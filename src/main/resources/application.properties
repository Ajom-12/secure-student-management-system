server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1601!}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_ACCESS_TOKEN_TTL_MS:900000}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_TTL_MS:604800000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
